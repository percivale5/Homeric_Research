name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy local images to dist
        run: mkdir -p dist && [ -d images ] && cp -r images dist/ || true

      - name: Convert Markdown to HTML with Marp
        uses: docker://marpteam/marp-cli:latest
        with:
          args: slides.md --theme-set themes/custom-uncover.css -o dist/index.html --html
        env:
          MARP_USER: 1001:127

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
